<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veabr AI Studio</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      padding: 16px;
      background: #0b1220;
      color: #f1f5f9;
    }
    .container {
      max-width: 640px;
      margin: 0 auto;
    }
    .card {
      background: #131d33;
      border: 1px solid #243354;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .modes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .mode-btn {
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #2c3e66;
      background: #0f172a;
      color: #e2e8f0;
      font-weight: 600;
      cursor: pointer;
    }
    .mode-btn.active {
      background: #2563eb;
      border-color: #3b82f6;
      color: #ffffff;
    }
    label {
      display: block;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 6px;
      margin-top: 12px;
    }
    textarea, select, input[type="file"] {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #2c3e66;
      background: #0c1424;
      color: #f8fafc;
      font-size: 15px;
    }
    textarea {
      min-height: 115px;
      resize: vertical;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .gen-btn {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .gen-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .note {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 10px;
      line-height: 1.5;
    }
    .result-box {
      white-space: pre-wrap;
      background: #0c1424;
      border: 1px solid #243354;
      border-radius: 12px;
      padding: 14px;
      min-height: 120px;
      line-height: 1.6;
      color: #e2e8f0;
    }
    .copy-btn {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #f8fafc;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="modes">
        <button type="button" class="mode-btn active" data-mode="AI Story">AI Story</button>
        <button type="button" class="mode-btn" data-mode="AI Script">AI Script</button>
        <button type="button" class="mode-btn" data-mode="AI Voice Script">AI Voice Script</button>
        <button type="button" class="mode-btn" data-mode="AI Music Prompt">AI Music Prompt</button>
      </div>

      <label for="promptInput">તમારો વિષય / સીન / પ્રોમ્પ્ટ</label>
      <textarea id="promptInput" placeholder="ઉદાહરણ: વરસાદી રાતે શહેરના રસ્તા પર ધીમે ચાલતી કાર, સિનેમેટિક લાઈટિંગ..."></textarea>

      <label for="refImage">Reference image (વૈકલ્પિક)</label>
      <input type="file" id="refImage" accept="image/*" />

      <div class="row">
        <div>
          <label for="languageSelect">Output language</label>
          <select id="languageSelect">
            <option value="ગુજરાતી" selected>ગુજરાતી</option>
            <option value="हिन्दी">हिन्दी</option>
            <option value="English">English</option>
          </select>
        </div>
        <div>
          <label for="lengthSelect">Length</label>
          <select id="lengthSelect">
            <option value="10 seconds" selected>10 seconds</option>
            <option value="15 seconds">15 seconds</option>
            <option value="30 seconds">30 seconds</option>
            <option value="60 seconds">60 seconds</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div>
          <label for="aspectSelect">Aspect ratio</label>
          <select id="aspectSelect">
            <option value="9:16 (Reels/Shorts)" selected>9:16 (Reels/Shorts)</option>
            <option value="16:9 (YouTube)">16:9 (YouTube)</option>
            <option value="1:1 (Square)">1:1 (Square)</option>
          </select>
        </div>
        <div>
          <label for="styleSelect">Style</label>
          <select id="styleSelect">
            <option value="Cinematic" selected>Cinematic</option>
            <option value="Motivational">Motivational</option>
            <option value="Storytelling">Storytelling</option>
            <option value="Dramatic">Dramatic</option>
          </select>
        </div>
      </div>

      <button type="button" id="generateBtn" class="gen-btn">✨ Generate with AI</button>
      <div class="note">
        API key Cloudflare Worker secret (GEMINI_API_KEY) દ્વારા સુરક્ષિત backend proxy (/api/generate) મારફતે વપરાય છે.
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top: 0;">AI Result</h3>
      <div id="resultBox" class="result-box">Prompt લખો અને Generate દબાવો. પરિણામ અહીં દેખાશે.</div>
      <button type="button" id="copyBtn" class="copy-btn">Copy Result</button>
    </div>
  </div>

  <script>
    let selectedMode = "AI Story";

    const modeButtons = document.querySelectorAll(".mode-btn");
    const promptInput = document.getElementById("promptInput");
    const refImage = document.getElementById("refImage");
    const languageSelect = document.getElementById("languageSelect");
    const lengthSelect = document.getElementById("lengthSelect");
    const aspectSelect = document.getElementById("aspectSelect");
    const styleSelect = document.getElementById("styleSelect");
    const generateBtn = document.getElementById("generateBtn");
    const resultBox = document.getElementById("resultBox");
    const copyBtn = document.getElementById("copyBtn");

    modeButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        modeButtons.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        selectedMode = btn.dataset.mode;
      });
    });

    generateBtn.addEventListener("click", async () => {
      const topic = promptInput.value.trim();
      if (!topic) {
        resultBox.textContent = "કૃપા કરીને પહેલા વિષય અથવા પ્રોમ્પ્ટ લખો.";
        return;
      }

      const fileName = refImage.files && refImage.files[0] ? refImage.files[0].name : "None";
      const fullPrompt = [
        `Mode: ${selectedMode}`,
        `Topic / Prompt: ${topic}`,
        `Reference image: ${fileName}`,
        `Output language: ${languageSelect.value}`,
        `Target length: ${lengthSelect.value}`,
        `Aspect ratio: ${aspectSelect.value}`,
        `Style: ${styleSelect.value}`
      ].join("\n");

      generateBtn.disabled = true;
      generateBtn.textContent = "Generating...";
      resultBox.textContent = "જવાબ તૈયાર થઈ રહ્યો છે...";

      try {
        const res = await fetch("/api/generate", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt: fullPrompt,
            model: "gemini-2.5-flash"
          })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || "API માંથી ભૂલ આવી છે.");
        }

        const outputText =
          data?.candidates?.[0]?.content?.parts?.[0]?.text ||
          "કોઈ જવાબ મળ્યો નથી.";

        resultBox.textContent = outputText;
      } catch (err) {
        resultBox.textContent = "ભૂલ: " + (err.message || "કનેક્શન સમસ્યા");
      } finally {
        generateBtn.disabled = false;
        generateBtn.textContent = "✨ Generate with AI";
      }
    });

    copyBtn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(resultBox.textContent);
        copyBtn.textContent = "Copied!";
        setTimeout(() => {
          copyBtn.textContent = "Copy Result";
        }, 1500);
      } catch {
        copyBtn.textContent = "Copy failed";
      }
    });
  </script>
</body>
</html>
